[project]
name = "agent-monitor-detection"
version = "0.1.0"
description = "Detection-theoretic AI-agent monitors: matched-budget sequential tests, per-context thresholds, monitor-aware attackers"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "pandas>=2.2",
  "pyarrow>=16",
  "matplotlib>=3.9",
  "httpx>=0.27",
  "tqdm>=4.66",
  "huggingface_hub>=0.25",
  "zstandard>=0.23",
  "scikit-learn>=1.5",
  "pyyaml>=6",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["amd"]
